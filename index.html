<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="수랑고등학교 동화 AU 페어 이야기 책장">
  <title>Once Upon a Time in Surang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Fredericka+the+Great&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Instrument+Sans:wght@400;500;600&family=Marcellus+SC&family=Nanum+Myeongjo:wght@400;700;800&family=Rochester&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css?v=18">
</head>
<body>
  <audio id="site-bgm-audio" loop autoplay preload="auto"></audio>
  <div id="app-toast" class="app-toast" role="status" aria-live="polite"></div>

  <section id="view-intro" class="view-section active intro-view" aria-label="인트로">
    <img class="ambient-photo intro-ambient-photo" src="assets/figma/intro-bg.jpg" alt="" aria-hidden="true">
    <img class="window-light intro-window" src="assets/figma/desktop-intro-window-light.png" alt="" aria-hidden="true">
    <img class="dust-art" src="assets/figma/desktop-intro-dust-layer.png" alt="" aria-hidden="true">
    <img class="mobile-intro-window" src="assets/figma/mobile-intro-window-light.svg" alt="" aria-hidden="true">
    <img class="mobile-intro-dust" src="assets/figma/mobile-intro-dust.svg" alt="" aria-hidden="true">
    <canvas class="ambient-particle-canvas intro-particle-canvas" aria-hidden="true"></canvas>

    <button class="site-bgm-widget intro-bgm-widget" type="button" aria-label="BGM 재생" aria-pressed="false">
      <span class="bgm-state-icon" aria-hidden="true"></span>
      <span>BGM</span>
    </button>

    <div class="intro-book">
      <img class="cover-glow" src="assets/figma/cover-glow.svg" alt="" aria-hidden="true">
      <div class="intro-book-inner">
        <img class="school-emblem" src="assets/figma/school-emblem.png" alt="">
        <p class="intro-edition">2026 SURANG</p>
        <div class="intro-title" aria-label="Once Upon a Time in Surang">
          <img class="desktop-title-logo" src="assets/figma/desktop-title-calligraphy.png" alt="" aria-hidden="true">
          <img class="mobile-title-logo" src="assets/figma/mobile-title-calligraphy.png" alt="" aria-hidden="true">
        </div>
        <p class="intro-subtitle">SURANG HIGHSCHOOL FAIRYTALE AU</p>
        <img class="intro-divider" src="assets/figma/ornate-divider.svg" alt="">
        <img class="mobile-intro-divider" src="assets/figma/mobile-intro-divider.svg" alt="" aria-hidden="true">
        <button id="btn-enter" class="start-button" type="button">
          <span>START</span>
          <img src="assets/figma/arrow-right.svg" alt="">
        </button>
        <p class="intro-school">Surang High School</p>
      </div>
    </div>
  </section>

  <section id="view-bookshelf" class="view-section shelf-view" aria-label="이야기 책장">
    <img class="ambient-photo" src="assets/figma/shelf-bg.jpg" alt="" aria-hidden="true">
    <img class="window-light shelf-window" src="assets/figma/desktop-shelf-window-light.png" alt="" aria-hidden="true">
    <img class="rose-overlay" src="assets/figma/dust-particles.svg" alt="" aria-hidden="true">
    <canvas class="ambient-particle-canvas" aria-hidden="true"></canvas>

    <header class="public-header">
      <button id="header-logo-home" class="public-logo" type="button" aria-label="처음으로">
        <img src="assets/figma/shelf-star.svg" alt="">
        <span>SURANG HIGHSCHOOL</span>
      </button>
      <button class="site-bgm-widget" type="button" aria-label="BGM 재생" aria-pressed="false">
        <span class="bgm-state-icon" aria-hidden="true"></span>
        <span>BGM</span>
      </button>
      <nav class="public-nav" aria-label="주요 메뉴">
        <button id="btn-minigame" type="button">MINIGAME</button>
        <button id="btn-guest-note" class="guest-note-button" type="button">GUEST NOTE</button>
      </nav>
    </header>

    <main class="shelves-stage">
      <div id="shelves-list" class="shelves-list"></div>
    </main>
  </section>

  <div id="popup-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="popup-book-title">
    <div class="popup-scrim"></div>
    <article class="open-book">
      <div class="popup-page popup-page-left">
        <img class="popup-paper-image" src="assets/figma/popup-paper-texture.jpg" alt="" aria-hidden="true">
        <div class="popup-cover">
          <img id="popup-cover-img" src="assets/figma/popup-cover-art.png" alt="">
          <div class="popup-cover-shade"></div>
          <p id="popup-project-label" class="popup-project-label">페어명</p>
          <img class="popup-cover-divider" src="assets/figma/popup-divider.svg" alt="">
        </div>
      </div>
      <div class="popup-gutter" aria-hidden="true"></div>
      <div class="popup-page popup-page-right">
        <img class="popup-paper-image" src="assets/figma/popup-paper-texture.jpg" alt="" aria-hidden="true">
        <button id="btn-close-popup" class="popup-close" type="button" aria-label="팝업 닫기">
          <img src="assets/figma/x-circle.svg" alt="">
        </button>
        <div class="popup-copy">
          <p id="popup-characters-row" class="popup-characters">캐릭터 이름 X 캐릭터 이름</p>
          <p id="popup-book-subtitle" class="popup-english">The Secret Garden</p>
          <h2 id="popup-book-title" class="popup-title">비밀의 화원</h2>
          <img class="popup-divider" src="assets/figma/popup-divider.svg" alt="">
          <p id="popup-book-desc" class="popup-description"></p>
          <button id="btn-read-more" class="open-story-button" type="button">
            <span>OPEN</span>
            <img src="assets/figma/arrow-right.svg" alt="">
          </button>
        </div>
      </div>
    </article>
  </div>

  <section id="view-detail" class="view-section detail-view" aria-label="책 상세">
    <img class="ambient-photo" src="assets/figma/detail-bg.jpg" alt="" aria-hidden="true">
    <div id="detail-backdrop" class="detail-backdrop" aria-hidden="true">
      <img id="detail-backdrop-img" src="assets/figma/detail-hero.png" alt="">
    </div>
    <img class="rose-overlay" src="assets/figma/dust-particles.svg" alt="" aria-hidden="true">
    <canvas class="ambient-particle-canvas" aria-hidden="true"></canvas>
    <div id="detail-hero" class="detail-hero">
      <img id="detail-bg-img" class="detail-hero-image" src="assets/figma/detail-hero.png" alt="">
      <div id="detail-gradient-overlay" class="detail-gradient-overlay"></div>
    </div>

    <div id="detail-ui-layer" class="detail-ui-layer">
      <header class="detail-header">
        <button id="btn-back-to-shelf" class="detail-back" type="button">
          <img src="assets/figma/arrow-right.svg" alt="">
          <span>BACK</span>
        </button>
        <button class="site-bgm-widget" type="button" aria-label="BGM 재생" aria-pressed="false">
          <span class="bgm-state-icon" aria-hidden="true"></span>
          <span>BGM</span>
        </button>
        <span class="detail-school">SURANG HIGHSCHOOL</span>
      </header>
      <div id="bubble-container" class="bubble-container"></div>
      <div class="detail-bottom-shade"></div>
      <div class="detail-meta">
        <p id="detail-characters" class="detail-characters"></p>
        <p id="detail-subtitle" class="detail-subtitle"></p>
        <h1 id="detail-title" class="detail-title"></h1>
        <p id="detail-description" class="detail-description"></p>
      </div>
    </div>

    <button id="btn-ui-toggle" class="ui-toggle-button" type="button" aria-pressed="true">
      <img src="assets/figma/eye.svg" alt="">
      <span>UI</span>
      <img id="ui-toggle-switch" src="assets/figma/toggle-switch.svg" alt="">
    </button>
    <button id="btn-orientation-toggle" class="orientation-toggle-button" type="button" aria-pressed="false">
      <span class="orientation-icon" aria-hidden="true"></span>
      <span class="orientation-label">가로 보기</span>
    </button>
  </section>

  <script src="js/firebase-config.js?v=1"></script>
  <script src="js/db.js?v=6"></script>
  <script src="js/index.js?v=16"></script>
</body>
</html>
