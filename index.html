<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Keep the storybook palette fixed even when the device is in dark mode. -->
  <meta name="color-scheme" content="light">
  <meta name="description" content="수랑고등학교 동화 AU 페어 이야기 책장">
  <title>Once Upon a Time in Surang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Fredericka+the+Great&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Hahmlet:wght@400;500;600;700&family=Inknut+Antiqua:wght@400&family=Instrument+Sans:wght@400;500;600&family=Marcellus+SC&family=Nanum+Myeongjo:wght@400;700;800&family=Rochester&display=swap" rel="stylesheet">
  <!-- Cute Spinning Flower Tan cursor by Cursors-4U. -->
  <link rel="stylesheet" href="https://cdn.cursors-4u.net/cursors/animated/cute-spinning-flower-tan-517a3242-32.css">
  <link rel="stylesheet" href="css/index.css?v=114">
</head>
<body data-color-mode="fixed-light">
  <audio id="site-bgm-audio" loop autoplay preload="auto"></audio>
  <div id="app-toast" class="app-toast" role="status" aria-live="polite"></div>

  <section id="view-intro" class="view-section active intro-view" aria-label="인트로">
    <img class="intro-bg intro-bg-composite intro-desktop-art" src="assets/figma/intro-pc-bg-composite.png" alt="" aria-hidden="true" fetchpriority="high">

    <!-- Decorative layers from Surangintro-page-pc2. -->
    <img class="intro-decor intro-desktop-art intro-pc-doily" src="assets/figma/intro-pc-doily.svg?v=2" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-deco-left" src="assets/figma/intro-pc-deco-left.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-deco-right" src="assets/figma/intro-pc-deco-right.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-letter-left" src="assets/figma/intro-pc-letter.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-letter-right" src="assets/figma/intro-pc-letter.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-keyboard" src="assets/figma/intro-pc-keyboard.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-watch" src="assets/figma/intro-pc-watch.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-rose" src="assets/figma/intro-pc-rose.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-tulip" src="assets/figma/intro-pc-tulip.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-book-mini" src="assets/figma/intro-pc-book-mini.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-book" src="assets/figma/intro-pc-book.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-apple" src="assets/figma/intro-pc-apple.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-butterfly" src="assets/figma/intro-pc-butterfly.png" alt="" aria-hidden="true">
    <img class="intro-decor intro-desktop-art intro-pc-window" src="assets/figma/intro-pc-window-light.svg" alt="" aria-hidden="true">

    <!-- Decorative layers from intro-page-mobile2. -->
    <div class="intro-mobile-stage" aria-hidden="true">
      <img class="intro-bg intro-mobile-art" src="assets/figma/intro-mobile-background.jpg" alt="" fetchpriority="high">
      <img class="intro-decor intro-mobile-art intro-mobile-doily" src="assets/figma/intro-mobile-doily.svg?v=3" alt="">
      <img class="intro-decor intro-mobile-art intro-mobile-deco-left" src="assets/figma/intro-mobile-deco-left.png" alt="">
      <img class="intro-decor intro-mobile-art intro-mobile-deco-right" src="assets/figma/intro-mobile-deco-right.png" alt="">
      <img class="intro-decor intro-mobile-art intro-mobile-letter-left" src="assets/figma/intro-mobile-letter.png" alt="">
      <img class="intro-decor intro-mobile-art intro-mobile-letter-right" src="assets/figma/intro-mobile-letter.png" alt="">
      <img class="intro-decor intro-mobile-art intro-mobile-keyboard" src="assets/figma/intro-mobile-keyboard.png" alt="">
      <img class="intro-decor intro-mobile-art intro-mobile-watch" src="assets/figma/intro-mobile-watch.png" alt="">
      <img class="intro-decor intro-mobile-art intro-mobile-rose" src="assets/figma/intro-mobile-rose.png" alt="">
      <img class="intro-decor intro-mobile-art intro-mobile-tulip" src="assets/figma/intro-mobile-tulip.png" alt="">
      <img class="intro-decor intro-mobile-art intro-mobile-book" src="assets/figma/intro-mobile-book.png" alt="">
      <img class="intro-decor intro-mobile-art intro-mobile-apple" src="assets/figma/intro-mobile-apple.png" alt="">
      <img class="intro-decor intro-mobile-art intro-mobile-window" src="assets/figma/intro-mobile-window-light.svg" alt="">
    </div>

    <canvas class="sun-bokeh-canvas" aria-hidden="true"></canvas>
    <canvas class="ambient-particle-canvas intro-particle-canvas" aria-hidden="true"></canvas>
    <button class="site-bgm-widget intro-bgm-widget" type="button" aria-label="BGM 재생" aria-pressed="false">
      <span class="bgm-state-icon" aria-hidden="true"></span>
      <span>BGM</span>
    </button>

    <div class="intro-book">
      <div class="intro-book-canvas">
        <img class="intro-cover-frame intro-desktop-art" src="assets/figma/intro-pc-cover-frame.png" alt="" aria-hidden="true">
        <img class="intro-cover-frame intro-cover-overlay intro-desktop-art" src="assets/figma/intro-pc-cover-overlay.png" alt="" aria-hidden="true">
        <img class="intro-cover-frame intro-mobile-art" src="assets/figma/intro-mobile-cover-frame.png" alt="" aria-hidden="true">
        <img class="intro-cover-frame intro-cover-overlay intro-mobile-art" src="assets/figma/intro-mobile-cover-overlay.png" alt="" aria-hidden="true">
        <img class="cover-glow" src="assets/figma/cover-glow.svg" alt="" aria-hidden="true">
        <div class="intro-book-inner">
          <img class="school-emblem" src="assets/figma/school-emblem.png" alt="">
          <p class="intro-edition">2026 SURANG</p>
          <div class="intro-title" aria-label="Once Upon a Time in Surang">
            <img class="desktop-title-logo" src="assets/figma/desktop-title-calligraphy.png?v=2" alt="" aria-hidden="true">
            <img class="mobile-title-logo" src="assets/figma/mobile-title-calligraphy.png?v=2" alt="" aria-hidden="true">
          </div>
          <p class="intro-subtitle">SURANG HIGHSCHOOL FAIRYTALE AU</p>
          <img class="intro-divider" src="assets/figma/ornate-divider.svg" alt="">
          <img class="mobile-intro-divider" src="assets/figma/ornate-divider.svg" alt="" aria-hidden="true">
          <button id="btn-enter" class="start-button" type="button"><span>START</span></button>
          <p class="intro-school">SURANG HIGHSCHOOL</p>
        </div>
      </div>
    </div>
  </section>

  <section id="view-bookshelf" class="view-section shelf-view" aria-label="이야기 책장">
    <img class="rose-overlay" src="assets/figma/dust-particles.svg" alt="" aria-hidden="true">
    <canvas class="ambient-particle-canvas" aria-hidden="true"></canvas>

        <div class="shelf-pc-top-dim" aria-hidden="true"></div>

        <header class="public-header">
      <button id="header-logo-home" class="public-logo" type="button" aria-label="처음으로">
        <span class="public-logo-badge"><img src="assets/figma/shelf-pc-star.svg" alt=""></span>
        <span>SURANG HIGHSCHOOL</span>
      </button>
      <button class="site-bgm-widget" type="button" aria-label="BGM 재생" aria-pressed="false">
        <span class="bgm-state-icon" aria-hidden="true"></span>
        <span>BGM</span>
      </button>
      <nav class="public-nav" aria-label="주요 메뉴">
        <button id="btn-minigame" type="button">MINIGAME</button>
        <button id="btn-guest-note" class="guest-note-button" type="button">GUEST NOTE</button>
      </nav>
    </header>

    <div class="shelf-scene-stage wood-paneling-bg">
      <div class="shelf-pc-cabinet" aria-hidden="true">
        <img src="assets/figma/bg-bookshelf.png" alt="">
      </div>
      <div class="shelf-layout-stage">
        <main class="shelves-stage">
          <div id="shelves-list" class="shelves-list"></div>
        </main>
      </div>
      <img class="shelf-decoration shelf-decoration-mini-frame" src="assets/figma/shelf-mini-frame.png" alt="" aria-hidden="true">
      <img class="shelf-decoration shelf-decoration-plant" src="assets/figma/shelf-plant.png" alt="" aria-hidden="true">
      <img class="shelf-decoration shelf-decoration-left-still-life" src="assets/figma/shelf-left-still-life.png" alt="" aria-hidden="true">
      <img class="shelf-decoration shelf-decoration-right-frame" src="assets/figma/shelf-right-frame.png" alt="" aria-hidden="true">
      <img class="shelf-pc-frame" src="assets/figma/shelf-pc-frame.png" alt="" aria-hidden="true">
    </div>
    <div class="shelf-pc-light-overlay" aria-hidden="true">
      <img class="shelf-pc-window-light" src="assets/figma/desktop-shelf-window-light.png" alt="">
    </div>
  </section>

  <div id="popup-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="popup-book-title">
    <div class="popup-scrim"></div>
    <article class="open-book">
      <div class="popup-page popup-page-left">
        <img class="popup-paper-image" src="assets/figma/popup-paper-texture.jpg" alt="" aria-hidden="true">
        <div class="popup-cover-frame">
          <picture class="popup-cover-ornament" aria-hidden="true">
            <source media="(aspect-ratio < 4 / 5)" srcset="assets/figma/popup-cover-back-mobile-latest.svg">
            <img src="assets/figma/popup-cover-back-pc.svg" alt="">
          </picture>
          <div class="popup-cover">
          <img id="popup-cover-img" class="managed-image" alt="">
          <div class="popup-cover-shade"></div>
          <p id="popup-project-label" class="popup-project-label">페어명</p>
          </div>
          <div class="popup-concept-banner" aria-hidden="true">
            <picture class="popup-concept-ribbon">
              <source media="(aspect-ratio < 4 / 5)" srcset="assets/figma/popup-concept-ribbon-mobile.svg">
              <img src="assets/figma/popup-concept-ribbon-pc.svg" alt="">
            </picture>
            <p id="popup-project-label-banner" class="popup-project-label"></p>
            <picture class="popup-concept-star">
              <source media="(aspect-ratio < 4 / 5)" srcset="assets/figma/popup-concept-star-mobile.svg">
              <img src="assets/figma/popup-concept-star-pc.svg" alt="">
            </picture>
          </div>
        </div>
      </div>
      <div class="popup-gutter" aria-hidden="true"></div>
      <div class="popup-page popup-page-right">
        <img class="popup-paper-image" src="assets/figma/popup-paper-texture.jpg" alt="" aria-hidden="true">
        <button id="btn-close-popup" class="popup-close" type="button" aria-label="팝업 닫기">
          <img src="assets/figma/x-circle.svg?v=2" alt="">
        </button>
        <div class="popup-copy">
          <p id="popup-characters-row" class="popup-characters">캐릭터 이름 X 캐릭터 이름</p>
          <p id="popup-book-subtitle" class="popup-english"><span class="popup-english-track">The Secret Garden</span></p>
          <h2 id="popup-book-title" class="popup-title">비밀의 화원</h2>
          <img class="popup-divider" src="assets/figma/popup-divider-long.svg" alt="">
          <p id="popup-book-desc" class="popup-description"></p>
          <button id="btn-read-more" class="open-story-button" type="button">
            <span>OPEN</span>
            <img src="assets/figma/arrow-right.svg" alt="">
          </button>
        </div>
      </div>
    </article>
  </div>

  <section id="view-detail" class="view-section detail-view" aria-label="책 상세">
    <img class="ambient-photo" src="assets/figma/detail-bg.jpg" alt="" aria-hidden="true">
    <div id="detail-backdrop" class="detail-backdrop" aria-hidden="true">
      <img id="detail-backdrop-img" class="managed-image" alt="">
    </div>
    <canvas class="ambient-particle-canvas" aria-hidden="true"></canvas>
    <div id="detail-hero" class="detail-hero">
      <img id="detail-bg-img" class="detail-hero-image managed-image" alt="">
      <div id="detail-gradient-overlay" class="detail-gradient-overlay"></div>
    </div>

    <div id="detail-ui-layer" class="detail-ui-layer">
      <header class="detail-header">
        <button id="btn-back-to-shelf" class="detail-back" type="button">
          <span>BACK</span>
        </button>
        <button class="site-bgm-widget" type="button" aria-label="BGM 재생" aria-pressed="false">
          <span class="bgm-state-icon" aria-hidden="true"></span>
          <span>BGM</span>
        </button>
        <span class="detail-school">SURANG HIGHSCHOOL</span>
      </header>
      <div id="bubble-container" class="bubble-container"></div>
      <div class="detail-bottom-shade"></div>
      <div class="detail-meta">
        <div class="detail-meta-header">
          <p id="detail-characters" class="detail-characters"></p>
          <p id="detail-subtitle" class="detail-subtitle"></p>
          <h1 id="detail-title" class="detail-title"></h1>
        </div>
        <p id="detail-description" class="detail-description"></p>
      </div>
    </div>

    <button id="btn-ui-toggle" class="ui-toggle-button" type="button" aria-label="UI 숨기기" aria-pressed="true">
      <img src="assets/figma/eye.svg" alt="">
      <span>UI</span>
    </button>
    <button id="btn-orientation-toggle" class="orientation-toggle-button" type="button" aria-pressed="false">
      <span class="orientation-icon" aria-hidden="true"></span>
      <span class="orientation-label">가로 보기</span>
    </button>
  </section>

  <script src="js/firebase-config.js?v=1"></script>
  <script src="js/db.js?v=9"></script>
  <script src="js/index.js?v=62"></script>
</body>
</html>
